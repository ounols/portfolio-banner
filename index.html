<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CSEngine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: black;
        border: none;
        outline: none;
      }

      #loading-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('bg.avif') center/cover no-repeat;
        filter: blur(20px);
        transform: scale(1.1);
        z-index: 1000;
        opacity: 0;
        animation: fade-in 0.5s ease-out forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      #loading-bg.ready {
        animation: none;
        opacity: 1;
        transition: opacity 1.5s ease-out;
      }

      #loading-bg.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-bg"></div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
      var loadingBg = document.getElementById('loading-bg');
      var canvasElement = document.getElementById('canvas');

      var fadeInDone = false;
      var loadingDone = false;

      function startFadeOut() {
        loadingBg.classList.add('ready');
        // force reflow so transition applies after class change
        loadingBg.offsetHeight;
        loadingBg.classList.add('fade-out');
        loadingBg.addEventListener('transitionend', () => {
          loadingBg.remove();
        });
      }

      loadingBg.addEventListener('animationend', () => {
        fadeInDone = true;
        if (loadingDone) startFadeOut();
      });

      // WebGL context lost 처리
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var Module = {
        print(...args) {
          console.log(...args);
        },
        canvas: canvasElement,
        setStatus(text) {
          if (!text) {
            loadingDone = true;
            if (fadeInDone) startFadeOut();
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };

      window.onerror = (event) => {
        console.error('[error] ' + event);
      };

      // 창 크기 변경시 캔버스 리사이즈 - C++ 코드에서 처리하므로 비활성화
      // function resizeCanvas() {
      //   canvasElement.width = window.innerWidth;
      //   canvasElement.height = window.innerHeight;
      // }

      // window.addEventListener('resize', resizeCanvas);
      // resizeCanvas();
    </script>
    <script async type="text/javascript" src="CSEngineWeb.js"></script>
  </body>
</html>
